name: 버그 신고 / Bug report
description: 잘못 동작하는 것을 알려주세요 / Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        한국어와 영어 모두 좋습니다. / Korean or English, both are fine.

        **파일이 사라졌거나 지워지면 안 될 것이 지워졌다면** 제목에 `[안전]`을 붙여주세요.
        가장 먼저 봅니다. / If something was removed that should not have been, prefix the
        title with `[safety]`. Those come first.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 / What happened
      placeholder: |
        예) 스크린샷을 골라서 정리를 눌렀는데 목록에서만 사라지고 파일은 그대로였습니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 어떻게 될 거라 생각했나요 / What did you expect
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 다시 만들려면 / Steps to reproduce
      placeholder: |
        1. 메뉴바 아이콘 클릭
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Attic 버전 / Attic version
      description: 설정 창 아래쪽에 있습니다 / Shown at the bottom of the Settings window
      placeholder: "0.2.23"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 버전과 기종 / macOS version and Mac model
      placeholder: "macOS 26.1 · MacBook Pro M3"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 그 밖에 / Anything else
      description: |
        스크린샷이 있으면 붙여주세요. **경로에 개인 정보가 있으면 가려주세요.**
        Screenshots help. Please redact anything private in the paths.
