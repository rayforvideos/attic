name: 제안 / Idea
description: 이런 것도 찾아주면 좋겠다, 이렇게 바뀌면 좋겠다 / Something it should find, or do differently
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        한국어와 영어 모두 좋습니다. / Korean or English, both are fine.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황인가요 / What is the situation
      description: |
        해결책보다 상황을 먼저 적어주세요. 무엇이 불편했는지 알면 더 나은 방법이 보일 때가 있습니다.
        Describe the problem before the solution. Knowing what got in your way often reveals a better fix.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 어떻게 하면 좋을까요 / What would you do
    validations:
      required: true

  - type: textarea
    id: space
    attributes:
      label: 새로 찾을 것을 제안한다면 / If this is a new thing to find
      description: |
        어느 경로인지, 지우면 다시 생기는지, 본인 맥에서 얼마나 차지하는지 알려주시면 큰 도움이 됩니다.
        Which path, whether it comes back on its own, and how much it takes up on your Mac.
      placeholder: |
        경로: ~/Library/Caches/...
        다시 생기나요: 네, 앱을 다시 켜면
        제 맥에서: 3.2GB
