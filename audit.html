<!doctype html><html><head><meta charset="utf-8"><title>폭별 검사</title>
<style>body{margin:0;font:13px monospace;background:#111;color:#eee}
iframe{border:0;height:900px;position:absolute;left:-9999px}</style></head>
<body><iframe id="f" src="index.html"></iframe><pre id="out">검사 중…</pre>
<script>
const WIDTHS = [320,360,390,414,430,500,600,700,768,820,900,1024,1180,1280,1440];
const f = document.getElementById("f"), out = document.getElementById("out");
function check(w) {
  return new Promise(resolve => {
    f.style.width = w + "px";
    setTimeout(() => {
      const doc = f.contentDocument, win = f.contentWindow;
      const vw = doc.documentElement.clientWidth;
      const bad = [];
      doc.querySelectorAll("body *").forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return;
        if (r.right > vw + 1.5 || r.left < -1.5) {
          const cs = win.getComputedStyle(el);
          if (cs.position === "absolute" && cs.pointerEvents === "none") return; // 장식용 빛
          bad.push(`${el.tagName.toLowerCase()}.${(el.className||"").toString().split(" ")[0]||"-"} [${Math.round(r.left)}..${Math.round(r.right)}]`);
        }
      });
      const scroll = doc.documentElement.scrollWidth > vw + 1;
      resolve(`${String(w).padStart(5)}px  ${bad.length ? "넘침 " + bad.slice(0,4).join(" | ") : "정상"}${scroll ? "  ← 가로 스크롤" : ""}`);
    }, 350);
  });
}
(async () => {
  const lines = [];
  for (const w of WIDTHS) lines.push(await check(w));
  out.textContent = lines.join("\n");
})();
</script></body></html>
